services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: ledger-sync-dynamodb
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: ledger-sync-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ledgersync
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
